/* ── HEADER SLIDER KEN BURNS ── */
header{position:relative;overflow:hidden;min-height:200px}

@keyframes kenburns-a{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.05) translate(-1%,-0.5%)}}
@keyframes kenburns-b{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.04) translate(1%,-1%)}}
@keyframes kenburns-c{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.06) translate(-0.5%,1%)}}

.slider-slide.activa{animation:kenburns-a var(--kb-dur,8s) ease-out forwards}

.slider-slide.activa:nth-child(4){animation-name:kenburns-d}

.slider-slide.activa:nth-child(6){animation-name:kenburns-b}
header>*:not(.slider-bg){position:relative;z-index:1}

// Poblar select de colecciones
const coleccionesMap = {};
DATOS.forEach(function(p){ if(!coleccionesMap[p.coleccion]) coleccionesMap[p.coleccion]=p.nombre_col; });
var selCol = document.getElementById('filtro-col');
Object.keys(coleccionesMap).sort().forEach(function(cod){
  var opt = document.createElement('option');
  opt.value = cod;
  var nombre = coleccionesMap[cod] || '';
  opt.textContent = cod + (nombre ? ' · ' + nombre.substring(0,22) : '');
  selCol.appendChild(opt);
});

var filtroFmt = 'todos', filtroCol = '', filtroDig = '', filtroBusq = '';

function normalizar(s){
  try { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  catch(e) { return String(s).toLowerCase(); }
}

function abreviar(t){
  if(!t) return '';
  var palabras = t.replace(/[()[\]]/g,'').split(/\s+/).filter(function(w){return w.length>2;}).slice(0,3);
  return palabras.join(' ').substring(0,20);
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(){
  var filmoteca = document.getElementById('filmoteca');
  var sinRes = document.getElementById('sin-resultados');
  var bq = normalizar(filtroBusq);

  var piezas = DATOS.filter(function(p){
    if(filtroFmt !== 'todos' && p.formato !== filtroFmt) return false;
    if(filtroCol && p.coleccion !== filtroCol) return false;
    if(filtroDig === 'si' && !p.digitalizada && !p.youtube) return false;
    if(filtroDig === 'no' && (p.digitalizada || p.youtube)) return false;
    if(bq){
      var h = normalizar(p.titulo+' '+p.codigo+' '+p.coleccion+' '+p.nombre_col);
      if(h.indexOf(bq) === -1) return false;
    }
    return true;
  });

  document.getElementById('contador').textContent = piezas.length + ' piezas';

  var bloques = filmoteca.querySelectorAll('.coleccion-bloque');
  for(var i=0;i<bloques.length;i++) bloques[i].remove();

  if(piezas.length === 0){ sinRes.style.display='block'; return; }
  sinRes.style.display='none';

  var grupos = {}, orden = [];
  piezas.forEach(function(p){
    if(!grupos[p.coleccion]){ grupos[p.coleccion]=[]; orden.push(p.coleccion); }
    grupos[p.coleccion].push(p);
  });

  orden.forEach(function(col){
    var lista = grupos[col];
    var bloque = document.createElement('div');
    bloque.className = 'coleccion-bloque';
    // Fondo thumbnail — primera pieza de la colección con imagen
    var bgPieza = lista.find(function(p){ return p.yt_thumb || p.boveda_img; });
    if(bgPieza){
      var bgDiv = document.createElement('div');
      bgDiv.className = 'coleccion-bg';
      bgDiv.style.backgroundImage = 'url('' + (bgPieza.yt_thumb || bgPieza.boveda_img) + '')';
      bloque.appendChild(bgDiv);
    }

    var nombre = lista[0].nombre_col || col;
    var h = document.createElement('div');
    h.className = 'coleccion-header';
    h.innerHTML = '<span class="coleccion-codigo">'+esc(col)+'</span><span class="coleccion-nombre">'+esc(nombre)+'</span><span class="coleccion-count">'+lista.length+' pieza'+(lista.length!==1?'s':'')+'</span>';
    bloque.appendChild(h);

    var fila = document.createElement('div');
    fila.className = 'latas-fila';

    
    // ── AGRUPACIÓN DE ROLLOS ──────────────────────────────
    // Piezas con mismo título+colección y campo rollos "X-2"
    // se fusionan en una sola lata representativa
    var listaAgrupada = [];
    var vistas = {};
    lista.forEach(function(p){
      var esRollo = /^\d+-\d+$/.test(p.rollos);
      if(!esRollo){ listaAgrupada.push(p); return; }
      var clave = p.coleccion + '|' + p.titulo.trim().toLowerCase();
      if(vistas[clave]){
        // Ya existe — añadir como hermano
        vistas[clave].hermanos = vistas[clave].hermanos || [];
        vistas[clave].hermanos.push(p);
        // Si este rollo tiene youtube y el representante no, usar este
        if(!vistas[clave].youtube && p.youtube) vistas[clave].youtube = p.youtube;
        if(!vistas[clave].yt_thumb && p.yt_thumb) vistas[clave].yt_thumb = p.yt_thumb;
        if(!vistas[clave].boveda_img && p.boveda_img) vistas[clave].boveda_img = p.boveda_img;
      } else {
        vistas[clave] = Object.assign({}, p);
        vistas[clave].hermanos = [];
        vistas[clave]._esRepresentante = true;
        listaAgrupada.push(vistas[clave]);
      }
    });

    listaAgrupada.forEach(function(p){

      var lata = document.createElement('div');
      lata.className = 'lata fmt-'+p.formato+(p.youtube?' digitalizada':'');
      lata.title = p.titulo || p.codigo;
      var imgSrc = p.boveda_img || p.yt_thumb || '';
      lata.innerHTML = '<div class="lata-disco">'
        + (imgSrc
            ? '<img src="'+esc(imgSrc)+'" alt="" class="lata-foto" loading="lazy">'
            : '')
        + '<div class="lata-disco-centro"></div>'
        + (imgSrc ? '' : '<div class="lata-etiqueta">'+esc(abreviar(p.titulo))+'</div>')
        + '</div>'
        + '<div class="lata-codigo">'+esc(p.codigo)+'</div>'
        + (p._esRepresentante && p.hermanos && p.hermanos.length > 0
            ? '<div class="lata-rollos-badge">' + (p.hermanos.length+1) + ' rollos</div>'
            : '');
      lata.addEventListener('click', (function(pp){ return function(){ abrirFicha(pp); }; })(p));
      fila.appendChild(lata);
    });

    bloque.appendChild(fila);
    filmoteca.appendChild(bloque);
  });
}

function abrirFicha(p){
  var fmt = p.formato || 'otro';
  document.getElementById('ficha-tope').className = 'ficha-tope fmt-'+fmt+'-tope';
  var lataMinEl = document.getElementById('ficha-lata-mini');
  lataMinEl.style.background = FMT_GRAD[fmt] || FMT_GRAD.otro;
  // Imagen real en la lata mini — foto Bóveda o thumbnail YouTube
  var imgSrcMini = p.boveda_img || p.yt_thumb || '';
  // Limpiar contenido anterior excepto el centro
  lataMinEl.innerHTML = '<div class="ficha-lata-mini-centro"></div>';
  if(imgSrcMini){
    var imgEl = document.createElement('img');
    imgEl.src = imgSrcMini;
    imgEl.className = 'ficha-lata-mini-img';
    imgEl.alt = '';
    imgEl.loading = 'lazy';
    lataMinEl.insertBefore(imgEl, lataMinEl.firstChild);
  }
  document.getElementById('ficha-codigo').textContent = p.id + ' · ' + p.codigo;
  document.getElementById('ficha-titulo').textContent = p.titulo || '(Sin título)';

  var tieneYT = p.youtube && p.youtube.trim().length > 5;
  var estaDigitalizada = p.digitalizada || tieneYT;
  var fmtNom = FMT_NOMBRES[fmt] || fmt;
  document.getElementById('ficha-badges').innerHTML =
    '<span class="badge badge-fmt-'+fmt+'">'+esc(fmtNom)+'</span>'+
    (tieneYT
      ? '<span class="badge badge-dig">&#9654; En l&#237;nea</span>'
      : (estaDigitalizada
          ? '<span class="badge badge-dig-local">Digitalizada</span>'
          : '<span class="badge badge-nodig">Sin digitalizar</span>')
    )+
    '<span class="badge badge-col">'+esc(p.coleccion)+'</span>';

  // Galería de imágenes: foto Bóveda + thumbnails de TODOS los videos
  var html = '';
  var imgs = [];

  // 1. Foto del objeto físico (Bóveda Abierta)
  if(p.boveda_img){
    imgs.push({
      src: p.boveda_img,
      label: 'Objeto f\u00edsico',
      href: p.boveda_href || ''
    });
  }

  // 2. Thumbnails de todos los videos YouTube
  if(p.youtube){
    var ytUrls = p.youtube.split('|').map(function(u){return u.trim();}).filter(function(u){return u.length>5;});
    ytUrls.forEach(function(u, i){
      var vid = '';
      var m1 = u.match(/[?&]v=([^&\s|]+)/);
      var m2 = u.match(/youtu\.be\/([^?&\s|]+)/);
      if(m1) vid = m1[1]; else if(m2) vid = m2[1];
      if(vid){
        imgs.push({
          src: 'https://img.youtube.com/vi/'+vid+'/hqdefault.jpg',
          label: ytUrls.length > 1 ? 'Video '+(i+1) : 'Fotograma del video',
          href: u
        });
      }
    });
  }

  if(imgs.length === 1){
    // Una sola imagen — mostrar grande
    var img = imgs[0];
    html += '<div class="ficha-imagen-wrap">'
      + '<img src="'+esc(img.src)+'" alt="'+esc(p.titulo)+'" class="ficha-imagen" loading="lazy">'
      + '<span class="ficha-imagen-label">'+esc(img.label)+'</span>'
      + (img.href ? '<a href="'+esc(img.href)+'" target="_blank" rel="noopener" class="boveda-link">'+(img.href.includes('blogspot')?'Ver en B\u00f3veda Abierta \u2197':'Ver en YouTube \u2197')+'</a>' : '')
      + '</div>';
  } else if(imgs.length > 1){
    // Varias imágenes — galería horizontal
    html += '<div class="ficha-galeria">';
    imgs.forEach(function(img){
      html += '<a href="'+(img.href||img.src)+'" target="_blank" rel="noopener" class="ficha-galeria-item">'
        + '<img src="'+esc(img.src)+'" alt="'+esc(img.label)+'" loading="lazy">'
        + '<span>'+esc(img.label)+'</span>'
        + '</a>';
    });
    html += '</div>';
  }

  html += '<div class="ficha-grid">';
    ['Colección', p.nombre_col||p.coleccion],
    ['Dirección', p.direccion],
    ['País de producción', p.pais],
    ['Fecha', p.fecha],
    ['Género', p.genero],
    ['Temáticas', p.temas],
    ['Paso', p.paso],
    ['Color', p.color],
    ['Audio', p.audio],
    ['Duración', p.duracion],
    ['Condiciones', p.condiciones],
    ['Procedencia', p.procedencia],
  ].filter(function(c){ return c[1] && c[1].trim() && c[1]!=='None'; });

  html += '<div class="ficha-grid">';
  campos.forEach(function(c){
    html += '<div class="ficha-campo"><div class="ficha-campo-label">'+esc(c[0])+'</div><div class="ficha-campo-valor">'+esc(c[1])+'</div></div>';
  });
  html += '</div>';

  if(p.sinopsis && p.sinopsis.trim() && p.sinopsis!=='None'){
    html += '<div class="ficha-obs">'+esc(p.sinopsis)+'</div>';
  }
  if(p.obs && p.obs.trim() && p.obs!=='None'){
    html += '<div class="ficha-obs" style="font-size:0.8rem;margin-top:0.5rem">'+esc(p.obs)+'</div>';
  }

  // ── ROLLOS ──────────────────────────────────────────────
  if(p.hermanos && p.hermanos.length > 0){
    var todos = [p].concat(p.hermanos).sort(function(a,b){
      var na = parseInt((a.rollos||'0').split('-')[0]);
      var nb = parseInt((b.rollos||'0').split('-')[0]);
      return na - nb;
    });
    html += '<div class="ficha-rollos"><div class="ficha-rollos-titulo">&#127903; Rollos (' + todos.length + ')</div>';
    todos.forEach(function(r){
      html += '<div class="ficha-rollo">'
        + '<span class="ficha-rollo-num">Rollo ' + esc(r.rollos||'?') + '</span>'
        + '<span class="ficha-rollo-cod">' + esc(r.codigo) + ' &middot; ' + esc(r.id) + '</span>'
        + (r.condiciones && r.condiciones!=='None' ? '<span class="ficha-rollo-estado">' + esc(r.condiciones) + '</span>' : '')
        + (r.youtube ? '<span class="badge badge-yt" style="font-size:0.65rem;padding:1px 5px;margin-left:auto">&#9654; En l&iacute;nea</span>' : '')
        + '</div>';
    });
    html += '</div>';
  }

  if(p.youtube){
    var urls = p.youtube.split('|').map(function(u){return u.trim();}).filter(function(u){return u.length > 5;});
    var pares = urls.map(function(u, i){
      var vid = '';
      // Extraer etiqueta entre corchetes: "url [Etiqueta]"
      var etiquetaCustom = '';
      var mEtiq = u.match(/\[([^\]]+)\]\s*$/);
      if(mEtiq){ etiquetaCustom = mEtiq[1]; u = u.replace(/\s*\[[^\]]+\]\s*$/, '').trim(); }
      var m1 = u.match(/[?&]v=([^&\s]+)/);
      var m2 = u.match(/youtu\.be\/([^?&\s]+)/);
      if(m1) vid = m1[1];
      else if(m2) vid = m2[1];
      var etiqueta;
      if(etiquetaCustom){
        etiqueta = etiquetaCustom;
      } else if(vid === 'Gjw8BhaPwPk'){
        etiqueta = 'Colecci\u00f3n completa';
      } else if(urls.length === 1){
        etiqueta = '';
      } else {
        etiqueta = 'V\u00eddeo ' + (i + 1);
      }
      return {url: u, vid: vid, etiqueta: etiqueta};
    }).filter(function(x){ return x.vid; });

    if(pares.length){
      html += '<div class="ficha-yt"><span class="yt-label">Ver en La Peque\u00f1a Filmoteca</span>';

      // Si hay múltiples, mostrar selectores de versión
      if(pares.length > 1){
        html += '<div class="yt-versiones">';
        pares.forEach(function(par, i){
          html += '<button class="yt-ver-btn'+(i===0?' activo':'')+'" data-vid="'+esc(par.vid)+'" onclick="seleccionarVideo(this)">'+esc(par.etiqueta)+'</button>';
        });
        html += '</div>';
      }

      // Player: thumbnail clicable que carga el iframe al hacer clic
      var vidPrincipal = pares[0].vid;
      var urlPrincipal = pares[0].url;
      html += '<div class="yt-player-wrap" id="yt-player-wrap">'
        + '<div class="yt-lite" id="yt-lite" data-vid="'+esc(vidPrincipal)+'" onclick="cargarIframe(this)">'
        + '<img src="https://img.youtube.com/vi/'+esc(vidPrincipal)+'/hqdefault.jpg" alt="Ver video" class="yt-lite-thumb">'
        + '<div class="yt-lite-play"><svg viewBox="0 0 68 48" width="68" height="48"><path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="#ff0000"/><path d="M45 24 27 14v20" fill="#fff"/></svg></div>'
        + '</div>'
        + '</div>';

      html += '<a href="'+esc(urlPrincipal)+'" target="_blank" rel="noopener" class="yt-ext-link">'
        + '<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>'
        + ' Abrir en YouTube</a>';

      html += '</div>';
    }
  }

  document.getElementById('ficha-body').innerHTML = html;
  document.getElementById('overlay').classList.add('abierto');
  document.body.style.overflow = 'hidden';
}

function cerrarFicha(){
  document.getElementById('overlay').classList.remove('abierto');
  document.body.style.overflow = '';
}

document.getElementById('ficha-cerrar').addEventListener('click', cerrarFicha);
document.getElementById('overlay').addEventListener('click', function(e){ if(e.target===this) cerrarFicha(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') cerrarFicha(); });

render();

function cargarIframe(el){
  var vid = el.getAttribute('data-vid');
  var wrap = el.parentNode;
  // Guardar referencia al vid en el wrap para el fallback
  wrap.setAttribute('data-vid', vid);
  wrap.innerHTML = '<iframe src="https://www.youtube.com/embed/'+vid+'?autoplay=1&rel=0&modestbranding=1" '
    +'frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" '
    +'allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>';
  // Escuchar mensajes de error del iframe (YouTube los emite via postMessage)
  var handler = function(e){
    if(e.data && typeof e.data === 'string'){
      try {
        var msg = JSON.parse(e.data);
        if(msg.event === 'onError' && (msg.info === 153 || msg.info === 150 || msg.info === 101)){
          window.removeEventListener('message', handler);
          mostrarFallback(wrap);
        }
      } catch(err){}
    }
  };
  window.addEventListener('message', handler);
  // Fallback por timeout: si el iframe no carga en 4s, mostrar enlace
  setTimeout(function(){
    var iframe = wrap.querySelector('iframe');
    if(iframe){
      // Intentar detectar si está bloqueado probando con imagen de error
      var img = new Image();
      img.onload = function(){};
      img.onerror = function(){};
    }
  }, 4000);
}

function mostrarFallback(wrap){
  var vid = wrap.getAttribute('data-vid');
  if(!vid) return;
  var url = 'https://www.youtube.com/watch?v='+vid;
  wrap.innerHTML = '<a href="'+url+'" target="_blank" rel="noopener" class="yt-fallback">'
    +'<img src="https://img.youtube.com/vi/'+vid+'/hqdefault.jpg" alt="Ver en YouTube" class="yt-lite-thumb">'
    +'<div class="yt-fallback-msg">'
    +'<svg viewBox="0 0 68 48" width="48" height="34"><path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="#ff0000"/><path d="M45 24 27 14v20" fill="#fff"/></svg>'
    +'<span>Ver en YouTube</span>'
    +'</div>'
    +'</a>';
}

function seleccionarVideo(btn){
  var vid = btn.getAttribute('data-vid');
  var btns = btn.parentNode.querySelectorAll('.yt-ver-btn');
  btns.forEach(function(b){ b.classList.remove('activo'); });
  btn.classList.add('activo');
  var wrap = document.getElementById('yt-player-wrap');
  if(!wrap) return;
  wrap.innerHTML = '<div class="yt-lite" data-vid="'+vid+'" onclick="cargarIframe(this)">'
    +'<img src="https://img.youtube.com/vi/'+vid+'/hqdefault.jpg" alt="Ver video" class="yt-lite-thumb">'
    +'<div class="yt-lite-play"><svg viewBox="0 0 68 48" width="68" height="48"><path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="#ff0000"/><path d="M45 24 27 14v20" fill="#fff"/></svg></div>'
    +'</div>';
}



// ─── MAPA ──────────────────────────────────────────────────────────────────
var mapaIniciado = false;
var mapaObj = null;
var vistaActual = 'latas'; // 'latas' o 'mapa'

function toggleVista(vista) {
  vistaActual = vista;
  var btnLatas = document.getElementById('btn-vista-latas');
  var btnMapa  = document.getElementById('btn-vista-mapa');
  var wrapLatas = document.getElementById('filmoteca');
  var wrapMapa  = document.getElementById('mapa-wrap');
  var leyenda   = document.querySelector('.leyenda');
  var controles = document.querySelector('.controles');

  if (vista === 'mapa') {
    btnLatas.classList.remove('activo');
    btnMapa.classList.add('activo');
    wrapLatas.style.display = 'none';
    wrapMapa.style.display  = 'block';
    leyenda.style.display   = 'none';
    if (!mapaIniciado) iniciarMapa();
    else if (mapaObj) setTimeout(function(){ mapaObj.invalidateSize(); }, 100);
  } else {
    btnMapa.classList.remove('activo');
    btnLatas.classList.add('activo');
    wrapLatas.style.display = 'block';
    wrapMapa.style.display  = 'none';
    leyenda.style.display   = '';
  }
}

function fmtColor(fmt) {
  var colors = {
    '8mm':'#C8A84B','16mm':'#4A7C9E','pathe':'#8B5E9E',
    '35mm':'#5A8A5A','nitrato':'#3A2A10','video':'#C85A3A','otro':'#7A6A5A'
  };
  return colors[fmt] || colors.otro;
}

function iniciarMapa() {
  mapaIniciado = true;
  // Leaflet ya está cargado via CDN
  var L = window.L;
  if (!L) { console.error('Leaflet no cargado'); return; }

  mapaObj = L.map('mapa-leaflet', {
    center: [20, -80],
    zoom: 3,
    preferCanvas: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 19
  }).addTo(mapaObj);

  // Añadir pins
  var pinData = DATOS.filter(function(p){ return p.lat !== null && p.lat !== undefined; });

  pinData.forEach(function(p) {
    var color = fmtColor(p.formato);
    var icon = L.divIcon({
      className: '',
      html: '<div style="width:12px;height:12px;border-radius:50%;background:'+color+';border:2px solid rgba(255,255,255,0.8);box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>',
      iconSize: [12, 12],
      iconAnchor: [6, 6]
    });
    var marker = L.marker([p.lat, p.lng], {icon: icon});
    marker.bindPopup(
      '<div style="font-family:DM Mono,monospace;min-width:200px">'
      + '<div style="font-size:0.65rem;color:#D4521A;margin-bottom:4px">'+esc(p.codigo)+' &middot; '+esc(p.id)+'</div>'
      + '<div style="font-size:0.85rem;font-weight:bold;font-family:serif;margin-bottom:6px">'+esc(p.titulo)+'</div>'
      + (p.loc ? '<div style="font-size:0.65rem;color:#7A6A5A;margin-bottom:6px">&#128205; '+esc(p.loc)+'</div>' : '')
      + '<div style="display:flex;gap:4px;margin-bottom:8px">'
      + '<span style="background:'+color+';color:#fff;padding:2px 6px;border-radius:2px;font-size:0.55rem;text-transform:uppercase">'+(FMT_NOMBRES[p.formato]||p.formato)+'</span>'
      + (p.youtube ? '<span style="background:#2D5A2D;color:#A8D8A8;padding:2px 6px;border-radius:2px;font-size:0.55rem">&#9654; En l&iacute;nea</span>' : '')
      + '</div>'
      + '<button onclick="abrirFichaDesdeId(\''+p.id+'\')" style="background:#D4521A;color:#fff;border:0;padding:5px 10px;border-radius:2px;font-family:DM Mono,monospace;font-size:0.65rem;cursor:pointer;width:100%">Ver ficha completa</button>'
      + '</div>',
      { maxWidth: 280 }
    );
    marker.addTo(mapaObj);
  });

  console.log('Mapa iniciado con', pinData.length, 'pins');
}

function abrirFichaDesdeId(id) {
  var p = DATOS.find(function(x){ return x.id === id; });
  if (p) {
    if (mapaObj) mapaObj.closePopup();
    abrirFicha(p);
  }
}
